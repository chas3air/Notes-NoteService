name: Executing tests for Note-Service

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Test Note-Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.12"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go

      - name: Run Unit Tests
        run: go test -v -short ./...

      - name: Run Integration Tests
        run: go test -v -timeout 5m -tags=integration ./internal/storage/postgres/...
