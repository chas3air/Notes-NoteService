services:
  noteservice:
    build:
      context: ./NoteService
    container_name: noteservice
    networks:
      - noteservice_net
    ports:
      - "8080:8080"
      - "9090:9090"
      - "50051:50051"
    depends_on:
      psql:
        condition: service_healthy
  psql:
    image: postgres:16
    container_name: notesstorage
    ports:
      - "5432:5432"
    networks:
      - noteservice_net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: notes_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes:
    - noteservice_psql_volume:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - noteservice_net
    restart: unless-stopped
  # добавить графану

networks:
  noteservice_net:

volumes:
  noteservice_psql_volume: